<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="circuitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#04091a" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas (Dark Cyber Navy / Deep Void) -->
  <rect width="1000" height="600" fill="#030712" rx="28" />

  <!-- Background Ambient Glow & Grid Accents -->
  <circle cx="280" cy="300" r="220" fill="url(#centerAura)" />
  
  <!-- Circuit Grid Background Traces -->
  <g opacity="0.15" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 80 180 L 160 180 L 200 220 L 200 380 L 160 420 L 80 420" fill="none" />
    <path d="M 280 90 L 280 150 L 240 190" fill="none" />
    <path d="M 280 510 L 280 450 L 320 410" fill="none" />
    <path d="M 480 180 L 400 180 L 360 220" fill="none" />
    <path d="M 480 420 L 400 420 L 360 380" fill="none" />
    <circle cx="80" cy="180" r="3" fill="#00f0ff" />
    <circle cx="80" cy="420" r="3" fill="#00f0ff" />
    <circle cx="480" cy="180" r="3" fill="#8b5cf6" />
    <circle cx="480" cy="420" r="3" fill="#8b5cf6" />
  </g>

  <!-- ==================================================== -->
  <!--               THE ICON / EMBLEM (LEFT)               -->
  <!-- ==================================================== -->
  <g transform="translate(40, 0)">
    <!-- Outer Cyber Hexagon / Pulse Frame -->
    <polygon points="240,110 350,174 350,302 240,366 130,302 130,174" 
             fill="none" 
             stroke="url(#glowRing)" 
             stroke-width="2.5" 
             stroke-dasharray="14 8 42 8" 
             opacity="0.55" 
             filter="url(#subtleGlow)" />

    <!-- Outer Concentric Energy Arc Rings -->
    <circle cx="240" cy="238" r="148" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6 12 28 8" opacity="0.4" />
    <circle cx="240" cy="238" r="162" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4 16" opacity="0.3" />

    <!-- Waveform Harmonics (Convergence of Hardware & Software Signals) -->
    <!-- Wave 1: Cyan High Frequency Sine / Digital Wave -->
    <path d="M 100 240 Q 135 150, 170 240 T 240 240 T 310 240 T 380 240" 
          fill="none" 
          stroke="url(#waveGrad1)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          filter="url(#neonGlow)" />

    <!-- Wave 2: Violet Inverted Harmonic Wave -->
    <path d="M 100 236 Q 135 320, 170 236 T 240 236 T 310 236 T 380 236" 
          fill="none" 
          stroke="url(#waveGrad2)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          opacity="0.85" 
          filter="url(#neonGlow)" />

    <!-- Central Futuristic 'A' / Waveform Core Monogram -->
    <!-- Left Apex Leg -->
    <path d="M 240 135 L 175 325 L 205 325 L 225 265 L 255 265 L 275 325 L 305 325 Z" 
          fill="url(#cyanPurpleGrad)" 
          opacity="0.95" 
          filter="url(#subtleGlow)" />

    <!-- Inner Core Cutout of 'A' with Inverted Wave Peak -->
    <polygon points="240,175 228,245 252,245" fill="#030712" />

    <!-- Digital Signal Pulse Bar bridging the A -->
    <rect x="200" y="246" width="80" height="4" rx="2" fill="#00f0ff" filter="url(#neonGlow)" />

    <!-- Hardware Circuit Nodes on the Apex -->
    <line x1="240" y1="135" x2="240" y2="85" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" filter="url(#subtleGlow)" />
    <circle cx="240" cy="85" r="5" fill="#00f0ff" filter="url(#neonGlow)" />
    <circle cx="240" cy="85" r="2" fill="#ffffff" />

    <!-- Satellite Circuit Nodes (Electronics & Communication) -->
    <line x1="175" y1="325" x2="145" y2="355" stroke="#00f0ff" stroke-width="2" />
    <circle cx="145" cy="355" r="4.5" fill="#00f0ff" />
    <circle cx="145" cy="355" r="1.8" fill="#ffffff" />

    <line x1="305" y1="325" x2="335" y2="355" stroke="#8b5cf6" stroke-width="2" />
    <circle cx="335" cy="355" r="4.5" fill="#8b5cf6" />
    <circle cx="335" cy="355" r="1.8" fill="#ffffff" />

    <!-- Signal Propagation Rings from Top Emitter -->
    <path d="M 220 72 A 22 22 0 0 1 260 72" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M 210 60 A 34 34 0 0 1 270 60" fill="none" stroke="#00c8ff" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
    <path d="M 200 48 A 46 46 0 0 1 280 48" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- ==================================================== -->
  <!--              TYPOGRAPHY & BRANDING (RIGHT)           -->
  <!-- ==================================================== -->
  <!-- Organizer Micro-Pill -->
  <g transform="translate(490, 160)">
    <rect x="0" y="0" width="370" height="30" rx="15" fill="#0d152b" stroke="url(#circuitGrad)" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#00f0ff" filter="url(#neonGlow)" />
    <text x="28" y="19" font-family="'Orbitron', 'Rajdhani', 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#00f0ff" letter-spacing="2.8">
      IEEE COMSOC SBC NSSCE PRESENTS
    </text>
  </g>

  <!-- Main Wordmark: AETHER WAVE -->
  <g transform="translate(490, 260)">
    <!-- Primary Title: AETHER -->
    <text x="0" y="0" font-family="'Orbitron', 'Space Grotesk', sans-serif" font-size="78" font-weight="900" fill="#ffffff" letter-spacing="6">
      AETHER
    </text>

    <!-- Secondary Title: WAVE with vibrant Cyber Gradient -->
    <text x="0" y="76" font-family="'Orbitron', 'Space Grotesk', sans-serif" font-size="82" font-weight="900" fill="url(#cyanPurpleGrad)" letter-spacing="8" filter="url(#subtleGlow)">
      WAVE
    </text>
  </g>

  <!-- Waveform Accent Divider Line under typography -->
  <g transform="translate(490, 368)">
    <path d="M 0 0 L 140 0 Q 155 -16, 170 0 T 200 0 L 260 0 Q 275 16, 290 0 T 320 0 L 440 0" 
          fill="none" 
          stroke="url(#cyanPurpleGrad)" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          filter="url(#subtleGlow)" />
    <circle cx="440" cy="0" r="3.5" fill="#8b5cf6" />
    <circle cx="0" cy="0" r="3.5" fill="#00f0ff" />
  </g>

  <!-- Tagline: CODE. BUILD. INNOVATE. -->
  <g transform="translate(492, 420)">
    <text x="0" y="0" font-family="'Orbitron', 'Rajdhani', sans-serif" font-size="20" font-weight="700" fill="#00f0ff" letter-spacing="7.5">
      CODE<tspan fill="#64748b"> • </tspan>BUILD<tspan fill="#64748b"> • </tspan><tspan fill="#8b5cf6">INNOVATE</tspan>
    </text>

    <text x="0" y="32" font-family="'Rajdhani', 'Share Tech Mono', sans-serif" font-size="15" font-weight="600" fill="#94a3b8" letter-spacing="2.5">
      HARDWARE &amp; SOFTWARE HACKATHON 2027
    </text>
  </g>

  <!-- Sleek corner decorative target marks -->
  <g stroke="#00f0ff" stroke-width="1.5" opacity="0.4">
    <path d="M 30 45 L 30 30 L 45 30" fill="none" />
    <path d="M 970 45 L 970 30 L 955 30" fill="none" />
    <path d="M 30 555 L 30 570 L 45 570" fill="none" />
    <path d="M 970 555 L 970 570 L 955 570" fill="none" />
  </g>
</svg>
