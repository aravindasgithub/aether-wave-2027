<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="wavePurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.3" />
    </linearGradient>

    <radialGradient id="iconAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#04091a" stop-opacity="0" />
    </radialGradient>

    <filter id="iconNeon" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Container -->
  <rect width="512" height="512" rx="110" fill="#04091a" stroke="rgba(0, 240, 255, 0.22)" stroke-width="3" />
  <circle cx="256" cy="256" r="210" fill="url(#iconAura)" />

  <!-- Outer Cyber Hexagon with subtle dashed glow -->
  <polygon points="256,76 412,166 412,346 256,436 100,346 100,166" 
           fill="none" 
           stroke="url(#iconGrad)" 
           stroke-width="3" 
           stroke-dasharray="16 10 50 10" 
           opacity="0.65" 
           filter="url(#iconNeon)" />

  <!-- Concentric Orbital Arcs -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-dasharray="8 14 36 10" opacity="0.45" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="6 20" opacity="0.35" />

  <!-- Hardware/Electronics Nodes on Vertices -->
  <circle cx="256" cy="76" r="6" fill="#00f0ff" filter="url(#iconNeon)" />
  <circle cx="256" cy="76" r="2.5" fill="#ffffff" />

  <circle cx="412" cy="166" r="5" fill="#00c8ff" />
  <circle cx="412" cy="346" r="5" fill="#8b5cf6" />
  <circle cx="256" cy="436" r="6" fill="#8b5cf6" filter="url(#iconNeon)" />
  <circle cx="256" cy="436" r="2.5" fill="#ffffff" />
  <circle cx="100" cy="346" r="5" fill="#00f0ff" />
  <circle cx="100" cy="166" r="5" fill="#00c8ff" />

  <!-- The Waveform Harmonics (Frequency & Data Signals) -->
  <!-- Cyan Wave -->
  <path d="M 80 256 Q 124 130, 168 256 T 256 256 T 344 256 T 432 256" 
        fill="none" 
        stroke="url(#waveCyan)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        filter="url(#iconNeon)" />

  <!-- Violet Inverted Harmonic Wave -->
  <path d="M 80 252 Q 124 374, 168 252 T 256 252 T 344 252 T 432 252" 
        fill="none" 
        stroke="url(#wavePurple)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        opacity="0.9" 
        filter="url(#iconNeon)" />

  <!-- Core Geometric "A" Monogram of AETHER WAVE -->
  <path d="M 256 128 L 176 352 L 214 352 L 238 284 L 274 284 L 298 352 L 336 352 Z" 
        fill="url(#iconGrad)" 
        opacity="0.95" 
        filter="url(#iconNeon)" />

  <!-- Negative Space Apex Notch -->
  <polygon points="256,176 242,260 270,260" fill="#04091a" />

  <!-- Glowing Digital Bridge / Pulse Bar across the A -->
  <rect x="210" y="260" width="92" height="5" rx="2.5" fill="#00f0ff" filter="url(#iconNeon)" />

  <!-- Transmitter Wave Pulses (Antenna Waves from top apex) -->
  <line x1="256" y1="128" x2="256" y2="76" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
  <path d="M 234 58 A 24 24 0 0 1 278 58" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <path d="M 222 42 A 38 38 0 0 1 290 42" fill="none" stroke="#00c8ff" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 210 26 A 52 52 0 0 1 302 26" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round" opacity="0.5" />
</svg>
